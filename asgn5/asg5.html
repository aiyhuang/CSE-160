<!DOCTYPE html>
<html lang="en">
<head>

<title>asg5</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}

#c {
  width: 100vw;
  height: 100vh;
  display: block;
}

#hud {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  font-family: monospace;
  z-index: 1;
  background: rgba(0, 0, 0, 0.45);
  padding: 10px;
  line-height: 1.4;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

</head>

<body>

<div id="hud">
  wasd to move<br>
  Space = move up<br>
  Shift = move down<br>
  F = add block<br>
  R = remove block<br>
 
</div>

<canvas id="c"></canvas>

<script type="module" src="./asg5.js"></script>
